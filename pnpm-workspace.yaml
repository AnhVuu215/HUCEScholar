packages:
  - apps/*
saveExact: true
engineStrict: true
allowBuilds:
  esbuild: true
  sharp: true
  '@nestjs/core': false
  unrs-resolver: true
  '@parcel/watcher': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  msgpackr-extract: false
# Advisories in transitive dependencies of the Prisma CLI (pnpm audit, 23/10/2026).
overrides:
  mysql2: 3.24.6
  deepmerge-ts: 8.0.2
