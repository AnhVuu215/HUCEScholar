name: hucescholar

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hucescholar
      POSTGRES_USER: hucescholar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hucescholar -d hucescholar']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.3-trixie
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    profiles: ['files']
    image: clamav/clamav:1.4.6@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  file-worker:
    profiles: ['files']
    build:
      context: ..
      dockerfile: infra/file-worker.Dockerfile
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://hucescholar:${POSTGRES_PASSWORD}@postgres:5432/hucescholar
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FILE_STORAGE: local
      FILE_LOCAL_ROOT: /data/files
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    volumes:
      - ../.local/files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    security_opt: ['no-new-privileges:true']

volumes:
  postgres_data:
  redis_data:
  clamav_data:
