# OPS-02 rehearsal: production settings on one machine, isolated from the dev stack.
# Garage stands in for private S3 and Caddy's internal CA for a real certificate, so a pass here
# is local evidence only. Next runs on the host (`host.docker.internal:3000`) to fit a 3 GB VM.
name: hucescholar-rehearsal

x-api-env: &api-env
  NODE_ENV: production
  APP_ORIGIN: https://localhost:8443
  DATABASE_URL: postgresql://hucescholar:${POSTGRES_PASSWORD}@postgres:5432/hucescholar
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CSRF_SECRET: ${CSRF_SECRET:?Run node scripts/rehearsal-env.mjs}
  FILE_STORAGE: s3
  # S3 mode still stages uploads and scans here; the image's `node` user owns this path.
  FILE_LOCAL_ROOT: /data/files
  S3_BUCKET: hucescholar-private
  S3_ENDPOINT: http://garage:3900
  AWS_REGION: garage
  AWS_ACCESS_KEY_ID: ${S3_APP_KEY_ID:?Run node scripts/rehearsal-env.mjs}
  AWS_SECRET_ACCESS_KEY: ${S3_APP_SECRET:?Run node scripts/rehearsal-env.mjs}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: '3310'

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: hucescholar
      POSTGRES_USER: hucescholar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/rehearsal-env.mjs}
    ports:
      - '127.0.0.1:55532:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hucescholar -d hucescholar']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.3-trixie
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run node scripts/rehearsal-env.mjs}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible private store. `node scripts/rehearsal-init.mjs` creates the bucket and app key.
  garage:
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Run node scripts/rehearsal-env.mjs}
    ports:
      - '127.0.0.1:53900:3900'
    volumes:
      - ./garage.rehearsal.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    mem_limit: 256m

  clamav:
    image: clamav/clamav:1.4.6@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  api:
    build:
      context: ..
      dockerfile: infra/file-worker.Dockerfile
    image: hucescholar-rehearsal-app:local
    command: ['node', 'dist/main.js']
    environment:
      <<: *api-env
      HOST: 0.0.0.0
      PORT: '3001'
      TRUSTED_PROXY_IPS: 172.30.0.10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.30.0.20
    mem_limit: 512m

  file-worker:
    image: hucescholar-rehearsal-app:local
    environment: *api-env
    depends_on:
      api:
        condition: service_started
      clamav:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 64
    security_opt: ['no-new-privileges:true']

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - '127.0.0.1:8443:443'
    volumes:
      - ./Caddyfile.rehearsal:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - api
    networks:
      default:
        ipv4_address: 172.30.0.10
    mem_limit: 128m

# A fixed subnet so TRUSTED_PROXY_IPS can name Caddy's exact address.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  clamav_data:
  caddy_data:
