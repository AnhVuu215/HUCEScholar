<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001e42" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mất kết nối — HUCEScholar</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f6fa;
        color: #172b45;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 42rem;
        margin: 12vh auto;
        padding: 32px;
      }
      .brand {
        color: #001e42;
        font-weight: 700;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.2;
        margin: 40px 0 24px;
      }
      p {
        margin: 16px 0;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 10px 20px;
        margin-top: 16px;
        border-radius: 6px;
        color: #fff;
        background: #0056a6;
        text-underline-offset: 3px;
      }
      a:hover {
        background: #003d7a;
      }
      a:focus-visible {
        outline: 3px solid #0056a6;
        outline-offset: 5px;
      }
      ::selection {
        background: #001e42;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">HUCEScholar</p>
      <h1>Bạn đang mất kết nối</h1>
      <p>Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử mở lại.</p>
      <p>
        PDF và ghi chú cần kết nối mạng. Trang này không chứa tài liệu hoặc thông tin tài khoản.
        Những thay đổi chưa được máy chủ xác nhận chưa được lưu.
      </p>
      <a href="/">Thử mở lại trang chủ</a>
    </main>
  </body>
</html>
